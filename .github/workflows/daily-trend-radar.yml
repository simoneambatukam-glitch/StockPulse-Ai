name: Daily Trend Radar — StockPulse AI

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run predictive engine (zero API key)
        run: node scripts/predict-trends.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/history.json; then
            echo "No changes to history.json"
          else
            git add public/data/history.json
            git commit -m "chore(predict): update 60-90 day stock forecast $(TZ='Asia/Jakarta' date +'%d %B %Y')"
            git push
          fi
