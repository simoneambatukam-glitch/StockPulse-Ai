name: Deploy to GitHub Pages

# Deploy frontend StockPulse AI (folder public/) ke GitHub Pages.
# Jalan otomatis setiap ada push ke main — termasuk commit harian
# dari workflow Daily Trend Radar — jadi situs selalu menampilkan
# data tren terbaru tanpa deploy manual.
#
# Aktifkan dulu di repo: Settings → Pages → Build and deployment →
# Source: GitHub Actions.
#
# URL situs: https://simoneambatukam-glitch.github.io/StockPulse-Ai/

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (folder public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
